version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edtech_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: edtech
    ports:
      - "5432:5432"
    volumes:
      - edtech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edtech"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edtech_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/edtech?schema=public
      JWT_SECRET: supersecretedtechjwtkey2026productionstyle987654321
      RAZORPAY_KEY_ID: rzp_test_edtechmock123
      RAZORPAY_KEY_SECRET: mocksecretkeyforrazorpayverification2026
      RAZORPAY_WEBHOOK_SECRET: mockwebhooksecret2026edtechkey
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edtech_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  edtech_pgdata:
